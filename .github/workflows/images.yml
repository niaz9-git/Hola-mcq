name: images - download all images and publish them

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Trial run: download only this many images (0 = all)"
        default: "0"

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the images (no login token is used here)
        run: |
          pip install requests
          python tools/download_images.py --urls data/image_urls.json --allow all --workers 8 --limit "${{ inputs.limit }}" --out out
          echo "images on disk:"; find out/img -type f | wc -l; du -sh out/img

      - name: Keep the map and the failure list (small files)
        uses: actions/upload-artifact@v4
        with:
          name: image-map
          path: |
            out/image_map.json
            out/image_failed.json
          retention-days: 90

      - name: Put only the images in a folder to publish
        run: |
          mkdir publish
          mv out/img publish/img

      - name: Create the Cloudflare Pages project (ignored if it already exists)
        if: ${{ vars.CF_IMAGES_PROJECT != '' && inputs.limit == '0' }}
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ vars.CF_IMAGES_PROJECT }} --production-branch=main

      - name: Publish the images to Cloudflare Pages
        if: ${{ vars.CF_IMAGES_PROJECT != '' && inputs.limit == '0' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy publish --project-name=${{ vars.CF_IMAGES_PROJECT }} --branch=main
